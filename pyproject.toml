[project]
name = "dynags"
version = "1.0.0"
description = "Transformer-based genome prediction model"
readme = "README.md"
requires-python = ">=3.10, <3.11"
authors = [{ name = "gaozhihong" }]

dependencies = [
    "torch==2.5.1",
    "numpy==1.23.5",
    "scipy==1.10.1",
    "pandas==2.0.3",
    "matplotlib==3.8.2",
    "scikit-learn==1.3.2",
    "xgboost==3.0.5",
    "seaborn==0.13.2",
    "pydantic==2.13.4",
]

[tool.uv]
concurrent-downloads = 8
environments = [
    "sys_platform == 'linux' and python_version == '3.10'",
    "sys_platform == 'win32' and python_version == '3.10'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.deptry.package_module_name_map]
scikit-learn = "sklearn"
opencv-python-headless = "cv2"
